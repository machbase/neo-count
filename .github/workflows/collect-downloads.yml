name: Collect download statistics

on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Collect and publish snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          stats="$RUNNER_TEMP/download-stats"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin refs/heads/download-stats; then
            git fetch origin refs/heads/download-stats
            git worktree add --detach "$stats" FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            git worktree add --detach "$stats" HEAD
            git -C "$stats" switch --orphan download-stats
          fi
          for attempt in 1 2 3; do
            go run . -collect -data-dir "$RUNNER_TEMP"
            git -C "$stats" add snapshots
            if git -C "$stats" diff --cached --quiet; then
              echo "No snapshot changes"
              exit 0
            fi
            git -C "$stats" commit -m "Record download snapshot"
            if git -C "$stats" push origin HEAD:refs/heads/download-stats; then
              exit 0
            fi
            echo "Push failed; refreshing data branch (attempt $attempt)" >&2
            git -C "$stats" fetch origin refs/heads/download-stats
            git -C "$stats" switch --detach FETCH_HEAD
          done
          echo "Unable to publish snapshot after 3 attempts" >&2
          exit 1
